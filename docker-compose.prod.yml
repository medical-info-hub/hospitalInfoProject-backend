version: '3.9'

networks:
  hospital-network:
    name: hospital-network
    driver: bridge

services:
  # MariaDB 데이터베이스
  mariadb:
    image: mariadb:10.11
    container_name: hospital-mariadb
    user: "999:999"  # MariaDB 기본 UID:GID 명시
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: hospital_api_db
      MYSQL_USER: hospitaluser
      MYSQL_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      MYSQL_TCP_PORT: 3500
    ports:
      - "3500:3500"
    volumes:
      - /opt/hospital/data/mariadb:/var/lib/mysql
    command: 
      - --port=3500
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --bind-address=0.0.0.0
    restart: unless-stopped
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 10
      interval: 10s
      start_period: 30s

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: hospital-redis
    expose:
      - "6379"
    volumes:
      - /opt/hospital/data/redis:/data
    command: >
      sh -c '
      if [ -n "${REDIS_PASSWORD}" ]; then
        echo "Starting Redis with password authentication..."
        redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass "${REDIS_PASSWORD}"
      else
        echo "Starting Redis without password..."
        redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
      fi
      '
    restart: unless-stopped
    networks:
      - hospital-network
    healthcheck:
      test: >
        sh -c '
        if [ -n "${REDIS_PASSWORD}" ]; then
          redis-cli --no-auth-warning -a "${REDIS_PASSWORD}" ping | grep PONG
        else
          redis-cli ping | grep PONG
        fi
        '
      timeout: 3s
      retries: 5
      interval: 10s
      start_period: 10s
  
  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: hospital-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/hospital/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/hospital/logs/nginx:/var/log/nginx
    depends_on:
      - backend-blue
    restart: unless-stopped
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Spring 백엔드 - Blue (현재 운영)
  backend-blue:
    image: hospital-backend:${IMAGE_TAG:-latest}
    container_name: hospital-backend-blue
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_PROFILES_ACTIVE=${ENVIRONMENT:-production}

      # Redis 연결 정보
      - REDIS_HOST=${REDIS_HOST:-hospital-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      # API 키 환경변수
      - HOSPITAL_MAIN_API_KEY=${HOSPITAL_MAIN_API_KEY}
      - HOSPITAL_DETAIL_API_KEY=${HOSPITAL_DETAIL_API_KEY}
      - HOSPITAL_MEDICAL_SUBJECT_API_KEY=${HOSPITAL_MEDICAL_SUBJECT_API_KEY}
      - HOSPITAL_PRODOC_API_KEY=${HOSPITAL_PRODOC_API_KEY}
      - HOSPITAL_PHARMACY_API_KEY=${HOSPITAL_PHARMACY_API_KEY}
      - HOSPITAL_EMERGENCY_API_KEY=${HOSPITAL_EMERGENCY_API_KEY}
      - API_ADMIN_KEY=${API_ADMIN_KEY}

      # API Base URL 환경변수
      - HOSPITAL_MAIN_API_BASE_URL=${HOSPITAL_MAIN_API_BASE_URL}
      - HOSPITAL_DETAIL_API_BASE_URL=${HOSPITAL_DETAIL_API_BASE_URL}
      - HOSPITAL_MEDICAL_SUBJECT_API_BASE_URL=${HOSPITAL_MEDICAL_SUBJECT_API_BASE_URL}
      - HOSPITAL_PRODOC_API_BASE_URL=${HOSPITAL_PRODOC_API_BASE_URL}
      - HOSPITAL_PHARMACY_API_BASE_URL=${HOSPITAL_PHARMACY_API_BASE_URL}
      - HOSPITAL_EMERGENCY_API_BASE_URL=${HOSPITAL_EMERGENCY_API_BASE_URL}
      - HOSPITAL_EMERGENCY_LOCATION_API_BASE_URL=${HOSPITAL_EMERGENCY_LOCATION_API_BASE_URL}

      # YouTube API 환경변수
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - YOUTUBE_API_BASE_URL=${YOUTUBE_API_BASE_URL}
      - YOUTUBE_API_TRUSTED_CHANNELS=${YOUTUBE_API_TRUSTED_CHANNELS}

      # Gemini API 환경변수
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_URL=${GEMINI_API_URL}
      - GEMINI_API_MODEL=${GEMINI_API_MODEL}

      # Chatbot 환경변수
      - CHATBOT_SYSTEM_PROMPT_FILE=${CHATBOT_SYSTEM_PROMPT_FILE}

      # Disease Statistics API 환경변수
      - DISEASE_STATS_API_KEY=${DISEASE_STATS_API_KEY}
      - DISEASE_STATS_API_BASE_URL=${DISEASE_STATS_API_BASE_URL}
    volumes:
      - /opt/hospital/logs/backend/blue:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 120s

  # Spring 백엔드 - Green (새 버전 배포용)
  backend-green:
    image: hospital-backend:${IMAGE_TAG:-latest}
    container_name: hospital-backend-green
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_PROFILES_ACTIVE=${ENVIRONMENT:-production}

      # Redis 연결 정보
      - REDIS_HOST=${REDIS_HOST:-hospital-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      # API 키 환경변수
      - HOSPITAL_MAIN_API_KEY=${HOSPITAL_MAIN_API_KEY}
      - HOSPITAL_DETAIL_API_KEY=${HOSPITAL_DETAIL_API_KEY}
      - HOSPITAL_MEDICAL_SUBJECT_API_KEY=${HOSPITAL_MEDICAL_SUBJECT_API_KEY}
      - HOSPITAL_PRODOC_API_KEY=${HOSPITAL_PRODOC_API_KEY}
      - HOSPITAL_PHARMACY_API_KEY=${HOSPITAL_PHARMACY_API_KEY}
      - HOSPITAL_EMERGENCY_API_KEY=${HOSPITAL_EMERGENCY_API_KEY}
      - API_ADMIN_KEY=${API_ADMIN_KEY}

      # API Base URL 환경변수
      - HOSPITAL_MAIN_API_BASE_URL=${HOSPITAL_MAIN_API_BASE_URL}
      - HOSPITAL_DETAIL_API_BASE_URL=${HOSPITAL_DETAIL_API_BASE_URL}
      - HOSPITAL_MEDICAL_SUBJECT_API_BASE_URL=${HOSPITAL_MEDICAL_SUBJECT_API_BASE_URL}
      - HOSPITAL_PRODOC_API_BASE_URL=${HOSPITAL_PRODOC_API_BASE_URL}
      - HOSPITAL_PHARMACY_API_BASE_URL=${HOSPITAL_PHARMACY_API_BASE_URL}
      - HOSPITAL_EMERGENCY_API_BASE_URL=${HOSPITAL_EMERGENCY_API_BASE_URL}
      - HOSPITAL_EMERGENCY_LOCATION_API_BASE_URL=${HOSPITAL_EMERGENCY_LOCATION_API_BASE_URL}

      # YouTube API 환경변수
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - YOUTUBE_API_BASE_URL=${YOUTUBE_API_BASE_URL}
      - YOUTUBE_API_TRUSTED_CHANNELS=${YOUTUBE_API_TRUSTED_CHANNELS}

      # Gemini API 환경변수
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_URL=${GEMINI_API_URL}
      - GEMINI_API_MODEL=${GEMINI_API_MODEL}

      # Chatbot 환경변수
      - CHATBOT_SYSTEM_PROMPT_FILE=${CHATBOT_SYSTEM_PROMPT_FILE}

      # Disease Statistics API 환경변수
      - DISEASE_STATS_API_KEY=${DISEASE_STATS_API_KEY}
      - DISEASE_STATS_API_BASE_URL=${DISEASE_STATS_API_BASE_URL}
    volumes:
      - /opt/hospital/logs/backend/green:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 120s
    profiles:
      - green
