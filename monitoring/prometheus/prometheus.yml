global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'hospital-api'
    environment: 'local'

scrape_configs:
  # Prometheus 자체 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Hospital Backend Local (Eclipse Tomcat 8080)
  - job_name: 'hospital-backend-local'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'hospital-api'
          service: 'backend'
          deployment: 'local'
